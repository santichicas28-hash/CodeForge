<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información para Reservar - SV travel</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #004080, #001f3f);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-regresar {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 15px;
      background: #ff9800;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }
    .btn-regresar:hover { background: #e65100; }

    .contenedor-form {
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      color: #004080;
      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #004080;
    }

    .campo input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
      box-sizing: border-box;
    }

    .btn-finalizar {
      width: 100%;
      padding: 15px;
      background: #4caf50;
      color: #fff;
      font-size: 1.2em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn-finalizar:hover {
      background: #388e3c;
    }
  </style>
</head>
<body>

  <a href="turismo_3.html" class="btn-regresar">Regresar</a>

  <div class="contenedor-form">
    <h2>Completa tu Información</h2>
    <form id="formReserva" onsubmit="finalizarReserva(event)">
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Tu nombre">
      </div>
      <div class="campo">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" placeholder="Tu apellido">
      </div>
      <div class="campo">
        <label for="dias">Días que estará en el país:</label>
        <input type="number" id="dias" min="1" placeholder="Ej. 5">
      </div>
      <div class="campo">
        <label for="telefono">Número de teléfono:</label>
        <input type="tel" id="telefono" placeholder="Ej. +503 7000 0000">
      </div>
      <button type="submit" class="btn-finalizar">Finalizar su reserva</button>
    </form>
  </div>

  <script>
    function finalizarReserva(event) {
      event.preventDefault(); 

      const nombre = document.getElementById('nombre').value.trim();
      const apellido = document.getElementById('apellido').value.trim();
      const dias = document.getElementById('dias').value.trim();
      const telefono = document.getElementById('telefono').value.trim();

      if (nombre === '' || apellido === '' || dias === '' || telefono === '') {
        alert('Complete la información');
      } else {
        alert('Reserva lista, dentro de poco te llamaremos');
        window.location.href = 'pagina_principal.html';
      } 
    }
  </script>

</body>
</html>
